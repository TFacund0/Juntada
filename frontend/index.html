<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0f0c1d" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Juntada" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Discovered by the browser immediately (not after JS parses/mounts,
         like the old in-component <link> was), so the cross-origin font
         connection/fetch overlaps the JS download instead of trailing it. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&display=swap" rel="stylesheet" />
    <!-- Rayado Libre: Figtree para el texto del juego y Permanent Marker para
         la pista y el tablero (ver font-figtree / font-marker en
         theme/tailwind.css). -->
    <link
      href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Figtree:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>Juntada</title>
    <meta name="description" content="Juegos para jugar en grupo" />
    <meta property="og:site_name" content="Juntada" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Juntada" />
    <meta property="og:description" content="Juegos para jugar en grupo" />
    <meta property="og:image" content="/icon-512.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Juntada" />
    <meta name="twitter:description" content="Juegos para jugar en grupo" />
    <meta name="twitter:image" content="/icon-512.png" />
    <style>
      /* El reset universal (margin/padding/box-sizing) vivía acá manualmente
         hasta que se detectó que rompía TODAS las utilities de margin y
         padding de Tailwind en todo el sitio: este bloque es CSS suelto,
         sin capa (layer), y en CSS cascade layers una regla sin capa le
         gana siempre a una regla con capa, sin importar especificidad.
         Como Tailwind envuelve sus utilities en una capa de utilidades,
         este reset universal ganaba contra cualquier clase de margen o
         padding del sitio, siempre. El Preflight propio de Tailwind
         (importado en theme/tailwind.css) ya aplica el mismo reset,
         correctamente ubicado en su capa base — no hace falta duplicarlo
         acá. Si en el futuro hace falta un reset adicional fuera de
         Tailwind, ubicarlo explícitamente en esa misma capa base. */
      /* color explícito (no solo background): los diálogos modales
         (DialogFrame, GroupEntryModal, RoomEntryModal, ...) usan
         createPortal directo a este <body>, así que quedan afuera del
         árbol donde App.tsx define color:#e8e4f0 (ver S.app en
         theme/styles.ts) — sin esto, cualquier texto ahí adentro que no
         fije su propio color caía al negro por defecto del navegador. */
      body {
        background: #0f0c1d;
        color: #e8e4f0;
      }
      /* Sin barra de scroll general (la página sigue scrolleando con rueda,
         touch o teclado) — puesto en el <style> inline, parseado antes que
         cualquier CSS/JS del bundle, para que la barra nativa nunca llegue a
         pintarse ni un frame al entrar a una pantalla nueva. */
      html,
      body {
        scrollbar-width: none;
        -ms-overflow-style: none;
      }
      html::-webkit-scrollbar,
      body::-webkit-scrollbar {
        display: none;
        width: 0;
        height: 0;
      }
      input,
      button,
      select,
      textarea {
        font-family: inherit;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
