<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0f0c1d" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Juntada" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Discovered by the browser immediately (not after JS parses/mounts,
         like the old in-component <link> was), so the cross-origin font
         connection/fetch overlaps the JS download instead of trailing it. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&display=swap" rel="stylesheet" />
    <title>Juntada</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      /* color explícito (no solo background): los diálogos modales
         (DialogFrame, GroupEntryModal, RoomEntryModal, ...) usan
         createPortal directo a este <body>, así que quedan afuera del
         árbol donde App.tsx define color:#e8e4f0 (ver S.app en
         theme/styles.ts) — sin esto, cualquier texto ahí adentro que no
         fije su propio color caía al negro por defecto del navegador. */
      body {
        background: #0f0c1d;
        color: #e8e4f0;
      }
      input,
      button,
      select,
      textarea {
        font-family: inherit;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
