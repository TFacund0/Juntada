name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck frontend
        run: pnpm --filter @juntada/frontend typecheck

      - name: Run backend tests
        run: pnpm --filter @juntada/backend test

      - name: Run frontend tests
        run: pnpm --filter @juntada/frontend test

      - name: Build frontend
        run: pnpm build:frontend
