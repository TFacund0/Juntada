services:
  - type: web
    name: juntada
    runtime: node
    plan: free
    buildCommand: pnpm install && pnpm build:frontend
    startCommand: pnpm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.11.0
      # Set this once a custom domain is pointed at the app, to restrict CORS
      # to it (e.g. https://juntada.com). Left unset today since frontend and
      # backend share the render.com origin, so cross-origin requests aren't
      # a realistic threat yet.
      # - key: CORS_ORIGIN
      #   value: https://your-domain.com
      # Set this to a Sentry.io project DSN to get error tracking in prod.
      # Left unset by default — error tracking is a no-op without it (see
      # backend/src/sentry.ts). Set it as a secret env var in the Render
      # dashboard, not here, so the DSN isn't committed to the repo.
      # - key: SENTRY_DSN
      #   sync: false
