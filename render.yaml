services:
  - type: web
    name: juntada
    runtime: node
    plan: free
    buildCommand: pnpm install && pnpm build:frontend
    startCommand: pnpm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.11.0
      # Set this once a custom domain is pointed at the app, to restrict CORS
      # to it (e.g. https://juntada.com). Left unset today since frontend and
      # backend share the render.com origin, so cross-origin requests aren't
      # a realistic threat yet.
      # - key: CORS_ORIGIN
      #   value: https://your-domain.com
      # Set this to a Sentry.io project DSN to get error tracking in prod.
      # Left unset by default — error tracking is a no-op without it (see
      # backend/src/sentry.ts). Set it as a secret env var in the Render
      # dashboard, not here, so the DSN isn't committed to the repo.
      # - key: SENTRY_DSN
      #   sync: false
      # Set this to a Redis connection URL (e.g. from upstash.com) so active
      # rooms/groups survive a restart (deploy, free-tier sleep) instead of
      # being wiped. Left unset by default — persistence is a no-op without
      # it (see backend/src/state/persistence.ts). Set it as a secret env
      # var in the Render dashboard, not here.
      # - key: REDIS_URL
      #   sync: false
      # Only matters if REDIS_URL points at a database shared with another
      # deployment (e.g. juntada-staging) — namespaces this service's
      # snapshot key so the two don't collide. Give each deployment sharing
      # a database a distinct value (e.g. staging sets REDIS_NAMESPACE to
      # "juntada-staging" in its own service's dashboard).
      - key: REDIS_NAMESPACE
        value: juntada-production
      # Postgres connection string for the account/auth data layer (see
      # backend/src/db/). Set as a secret env var in the Render dashboard,
      # not here — auth routes fail at the DB call (not at boot) until this
      # is set (see backend/src/db/client.ts and env.ts).
      # - key: DATABASE_URL
      #   sync: false
      # HS256 signing secrets for access/refresh JWTs (see
      # backend/src/auth/service/tokenService.ts). Set as secret env vars in
      # the Render dashboard, not here.
      # - key: JWT_ACCESS_SECRET
      #   sync: false
      # - key: JWT_REFRESH_SECRET
      #   sync: false
      # Resend API key for password-reset email (see
      # backend/src/auth/mail/resendMailer.ts). Set as a secret env var in
      # the Render dashboard, not here. Ships against Resend's shared test
      # domain until a custom domain is verified (see design doc — a
      # pre-production release gate, not a code change).
      # - key: RESEND_API_KEY
      #   sync: false
      # Base URL the frontend is served from, used to build the
      # password-reset email link. Defaults to http://localhost:5173 if
      # unset — set this once the app has a real domain.
      # - key: APP_URL
      #   value: https://your-domain.com
